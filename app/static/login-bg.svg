<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900"
     preserveAspectRatio="xMidYMid slice" role="img"
     aria-label="淡雅的远山背景">
  <title>登录页背景</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#f6f9fc"/>
      <stop offset="52%"  stop-color="#eaf2f7"/>
      <stop offset="100%" stop-color="#dfeaf1"/>
    </linearGradient>

    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#9dc0ae" stop-opacity=".34"/>
      <stop offset="100%" stop-color="#86ae9b" stop-opacity=".16"/>
    </linearGradient>

    <linearGradient id="mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#7faa95" stop-opacity=".30"/>
      <stop offset="100%" stop-color="#6d9a85" stop-opacity=".13"/>
    </linearGradient>

    <linearGradient id="near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#5f8f7b" stop-opacity=".24"/>
      <stop offset="100%" stop-color="#54806e" stop-opacity=".10"/>
    </linearGradient>

    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#f3e6c8" stop-opacity=".70"/>
      <stop offset="100%" stop-color="#f3e6c8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1440" height="900" fill="url(#sky)"/>

  <!-- 远处的太阳光晕 -->
  <circle cx="1130" cy="196" r="210" fill="url(#sun)"/>
  <circle cx="1130" cy="196" r="62" fill="#f0e2c2" opacity=".55"/>

  <!-- 远山 -->
  <path fill="url(#far)"
        d="M0,632 L150,502 L286,596 L438,470 L596,600 L742,516
           L902,614 L1064,498 L1226,600 L1360,536 L1440,584
           L1440,900 L0,900 Z"/>

  <!-- 中景山 -->
  <path fill="url(#mid)"
        d="M0,724 L184,610 L352,706 L520,596 L700,712 L888,614
           L1064,714 L1240,626 L1400,706 L1440,684
           L1440,900 L0,900 Z"/>

  <!-- 近景缓坡 -->
  <path fill="url(#near)"
        d="M0,812 L210,742 L420,806 L648,736 L876,812 L1104,746
           L1330,816 L1440,780
           L1440,900 L0,900 Z"/>
</svg>
