{% extends "base.html" %}
{% block title %}新增用户{% endblock %}
{% block content %}
<div class="card">
  <h2>新增用户</h2>
  <form method="post">
    <table style="width:auto;">
      <tr><td style="text-align:left;">用户名</td><td><input type="text" name="username" required></td></tr>
      <tr><td style="text-align:left;">密码</td><td><input type="password" name="password" required></td></tr>
      <tr>
        <td style="text-align:left;">角色</td>
        <td>
          <select name="role">
            <option value="viewer">查看者</option>
            <option value="evaluator">评价员</option>
            <option value="admin">管理员</option>
          </select>
        </td>
      </tr>
    </table>
    <p style="margin-top:14px;">
      <button type="submit" class="btn">保存</button>
      <a href="/users" class="btn gray">返回</a>
    </p>
  </form>
</div>
{% endblock %}
