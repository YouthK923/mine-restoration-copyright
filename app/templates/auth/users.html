{% extends "base.html" %}
{% block title %}用户管理{% endblock %}
{% block content %}
<div class="card">
  <h2>用户管理</h2>
  {% if current_user.role == "admin" %}
  <p style="margin-bottom:12px;"><a href="/users/add" class="btn small">新增用户</a></p>
  {% endif %}
  <table>
    <tr><th>ID</th><th>用户名</th><th>角色</th><th>状态</th></tr>
    {% for u in users %}
    <tr>
      <td>{{ u.id }}</td>
      <td>{{ u.username }}</td>
      <td>{{ u.role }}</td>
      <td>{% if u.active %}<span class="ok">启用</span>{% else %}<span class="muted">停用</span>{% endif %}</td>
    </tr>
    {% endfor %}
  </table>
</div>
{% endblock %}
