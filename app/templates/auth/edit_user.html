{% extends "base.html" %}
{% block title %}编辑用户 · {{ user.username }}{% endblock %}
{% block content %}
<div class="card" style="max-width:560px;">
  <h2>编辑用户 · {{ user.username }}</h2>

  <h3 style="margin:0 0 12px;font-size:15px;">个人资料</h3>
  <p class="muted" style="margin:0 0 14px;font-size:12.5px;">
    以下内容用户也可在「个人设置」中自行修改，此处为管理员代改。
  </p>

  <form method="post">
    {{ form.hidden_tag() }}

    <div class="field">
      <label class="field__label" for="display_name">显示名称</label>
      <input id="display_name" type="text" name="display_name" maxlength="64"
             value="{{ user.display_name or '' }}"
             placeholder="留空则显示登录账号">
    </div>

    <div class="field">
      <label class="field__label" for="title">职务</label>
      <input id="title" type="text" name="title" maxlength="64"
             value="{{ user.title or '' }}" placeholder="如：评价员、项目负责人">
    </div>

    <div class="field">
      <label class="field__label" for="email">邮箱</label>
      <input id="email" type="text" name="email" maxlength="128"
             value="{{ user.email or '' }}">
    </div>

    <div class="field">
      <label class="field__label" for="phone">手机号</label>
      <input id="phone" type="text" name="phone" maxlength="32"
             value="{{ user.phone or '' }}">
    </div>

    <hr style="margin:22px 0;border:none;border-top:1px solid var(--line);">

    <h3 style="margin:0 0 12px;font-size:15px;">账号与权限</h3>

    <div class="field">
      <label class="field__label" for="role">角色</label>
      <select id="role" name="role">
        {% for code, label in role_labels.items() %}
        <option value="{{ code }}" {% if user.role == code %}selected{% endif %}>{{ label }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="field">
      <label class="checkbox" for="active">
        <input id="active" type="checkbox" name="active" value="1"
               {% if user.active %}checked{% endif %}>
        <span>启用该账号</span>
      </label>
      <p class="muted" style="margin:6px 0 0;">
        停用后该账号无法登录，但其历史操作记录会保留。
        系统至少需保留一名启用状态的管理员。
      </p>
    </div>

    <div class="field">
      <label class="field__label" for="password">重置密码（留空则不修改）</label>
      <input id="password" type="password" name="password"
             autocomplete="new-password" style="width:280px;"
             placeholder="留空表示保持原密码">
    </div>

    <p class="actions" style="margin-top:18px;">
      <button type="submit" class="btn">保存</button>
      <a class="btn btn--ghost" href="/users">返回</a>
    </p>
  </form>
</div>
{% endblock %}
