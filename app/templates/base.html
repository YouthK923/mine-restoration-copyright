<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}历史遗留废弃矿山自然恢复适宜性评价系统{% endblock %}</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Microsoft YaHei", "SimSun", sans-serif;
      background: #f4f5f7; color: #333; font-size: 14px;
    }
    .topbar {
      background: #1f3a5f; color: #fff; padding: 12px 24px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .topbar h1 { font-size: 18px; font-weight: 600; }
    .topbar .ver { font-size: 12px; opacity: .85; }
    .nav {
      background: #fff; border-bottom: 1px solid #dcdde0;
      padding: 0 24px; display: flex; flex-wrap: wrap;
    }
    .nav a {
      display: inline-block; padding: 10px 16px; text-decoration: none;
      color: #444; border-bottom: 2px solid transparent;
    }
    .nav a:hover, .nav a.active { color: #1f3a5f; border-bottom-color: #1f3a5f; }
    .container { max-width: 1080px; margin: 24px auto; padding: 0 24px; }
    .card {
      background: #fff; border: 1px solid #e3e4e6; border-radius: 6px;
      padding: 24px; margin-bottom: 20px;
    }
    .card h2 { font-size: 16px; margin-bottom: 16px; color: #1f3a5f; }
    table { border-collapse: collapse; width: 100%; margin: 8px 0 16px; }
    th, td { border: 1px solid #dcdde0; padding: 8px 12px; text-align: center; }
    th { background: #eef1f5; font-weight: 600; }
    input[type="text"], input[type="number"], input[type="password"],
    select { padding: 6px 8px; border: 1px solid #c9ccd1; border-radius: 4px; }
    input[type="number"] { width: 80px; text-align: center; }
    .btn {
      display: inline-block; padding: 8px 20px; border: none; border-radius: 4px;
      background: #1f3a5f; color: #fff; cursor: pointer; font-size: 14px;
    }
    .btn:hover { background: #2a4d7c; }
    .flash { padding: 10px 16px; border-radius: 4px; margin-bottom: 16px; }
    .flash.error { background: #fdecea; color: #c0392b; border: 1px solid #f5c6cb; }
    .flash.ok { background: #eafaf1; color: #1e8449; border: 1px solid #b2dfdb; }
    .muted { color: #888; font-size: 12px; }
    .mono { font-family: Consolas, monospace; }
    .warn { color: #c0392b; font-weight: 600; }
    .ok { color: #1e8449; font-weight: 600; }
  </style>
</head>
<body>
  <div class="topbar">
    <h1>历史遗留废弃矿山自然恢复适宜性评价系统</h1>
    <span class="ver">V1.0</span>
  </div>
  <div class="nav">
    <a href="/">首页</a>
    <a href="/ahp/">AHP 权重计算</a>
    <a href="/indicator/">指标数据</a>
    <a href="/evaluate/">适宜性评价</a>
    <a href="/report/">报告输出</a>
  </div>
  <div class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </div>
</body>
</html>
