{% extends "base.html" %}
{% block title %}{{ "编辑项目" if project else "新建项目" }}{% endblock %}
{% block content %}
<div class="card" style="max-width:640px;">
  <h2>{{ "编辑项目" if project else "新建项目" }}</h2>
  <form method="post">
    {{ form.hidden_tag() }}

    <div class="field">
      <label class="field__label" for="name">项目名称</label>
      <input id="name" type="text" name="name" style="width:100%;" required
             value="{{ project.name if project else '' }}">
    </div>

    <div class="field">
      <label class="field__label" for="code">项目编号</label>
      <input id="code" type="text" name="code" style="width:240px;"
             value="{{ project.code or '' if project else '' }}">
    </div>

    {% if project %}
    <div class="field">
      <label class="field__label" for="status">状态</label>
      <select id="status" name="status">
        {% for s in ["进行中", "已完成", "已归档"] %}
        <option value="{{ s }}" {% if project.status == s %}selected{% endif %}>{{ s }}</option>
        {% endfor %}
      </select>
    </div>
    {% endif %}

    <div class="field">
      <label class="field__label" for="description">项目说明</label>
      <textarea id="description" name="description">{{ project.description or '' if project else '' }}</textarea>
    </div>

    <p class="actions" style="margin-top:18px;">
      <button type="submit" class="btn">保存</button>
      <a class="btn btn--ghost" href="/project/">返回</a>
    </p>
  </form>
</div>
{% endblock %}
