{% extends "base.html" %}
{% block title %}{{ "编辑项目" if project else "新建项目" }}{% endblock %}
{% block content %}
<div class="card">
  <h2>{{ "编辑项目" if project else "新建项目" }}</h2>
  <form method="post">
    {{ form.hidden_tag() }}
    <table style="width:auto;">
      <tr><td style="text-align:left;">项目名称</td>
          <td><input type="text" name="name" style="width:320px;" value="{{ project.name if project else '' }}" required></td></tr>
      <tr><td style="text-align:left;">项目编号</td>
          <td><input type="text" name="code" value="{{ project.code or '' if project else '' }}"></td></tr>
      {% if project %}
      <tr><td style="text-align:left;">状态</td>
          <td>
            <select name="status">
              {% for s in ["进行中", "已完成", "已归档"] %}
              <option value="{{ s }}" {% if project.status == s %}selected{% endif %}>{{ s }}</option>
              {% endfor %}
            </select>
          </td></tr>
      {% endif %}
      <tr><td style="text-align:left;vertical-align:top;">项目说明</td>
          <td><textarea name="description" style="width:320px;">{{ project.description or '' if project else '' }}</textarea></td></tr>
    </table>
    <p style="margin-top:14px;">
      <button type="submit" class="btn">保存</button>
      <a href="/project/" class="btn gray">返回</a>
    </p>
  </form>
</div>
{% endblock %}
