{% extends "base.html" %}
{% block title %}报告输出{% endblock %}
{% block content %}
<div class="card">
  <h2>报告与结果输出</h2>
  <p class="muted">可查看逐层得分明细，并导出规范的评价报告文档。</p>

  {% if not patches %}
  <p class="muted">暂无矿山图斑。请先在「项目与档案」中建立图斑并完成评价。</p>
  {% else %}
  <table>
    <thead>
      <tr>
        <th scope="col">矿山图斑</th>
        <th scope="col">操作</th>
      </tr>
    </thead>
    <tbody>
      {% for p in patches %}
      <tr>
        <td style="text-align:left;">{{ p.name }}</td>
        <td class="nowrap">
          <a href="/report/{{ p.id }}">查看得分明细</a>
          &nbsp;|&nbsp;<a href="/report/{{ p.id }}/word">导出 Word 报告</a>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
  {% endif %}
</div>
{% endblock %}
